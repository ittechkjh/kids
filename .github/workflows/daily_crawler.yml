name: Daily Restaurant Batch Crawler

on:
  schedule:
    # 매일 한국 시간(KST) 새벽 03:00 실행 (UTC 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch: # GitHub 웹페이지에서 [Run workflow] 버튼으로 즉시 수동 실행 가능

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 일일 안전 분할 크롤러 실행
        run: |
          python scripts/safe_crawler.py

      - name: 변경 데이터 자동 커밋 및 배포
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/restaurants_data.js
          if git diff --staged --quiet; then
            echo "갱신할 변경사항이 없습니다."
          else
            git commit -m "chore(crawler): 일일 맛집 데이터 자동 수집 및 갱신 [skip ci]"
            git push origin main
          fi

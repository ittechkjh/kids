name: Daily Restaurant Batch Crawler

on:
  schedule:
    # 매일 한국 시간(KST) 새벽 03:00 실행 (UTC 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch: # GitHub 웹페이지에서 [Run workflow] 버튼으로 즉시 수동 실행 가능

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 일일 안전 분할 맛집 크롤러 및 전국 행사·대회 데이터 수집기 실행
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY || 'G7N6elMlYOmqsOnctk%2B0X1Dpyz1ajBFF82gcH8Sl%2FgRDD5Jb4gangmAU2KZgmWSerzjtZqEQLlAxay4dFH3IPw%3D%3D' }}
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY || '6c424a69706b6a68323363476f4363' }}
        run: |
          python scripts/safe_crawler.py
          python scripts/build_events_data.py

      - name: 변경 데이터 자동 커밋 및 배포
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/restaurants_data.js js/events_data.js
          if git diff --staged --quiet; then
            echo "갱신할 변경사항이 없습니다."
          else
            git commit -m "chore(crawler): 일일 맛집 & 전국 대회·행사 데이터 자동 수집 및 갱신 [skip ci]"
            git push origin main
          fi

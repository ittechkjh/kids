name: Daily Restaurant & Tourism Batch Crawler

on:
  schedule:
    # 매일 한국 시간(KST) 새벽 03:15 실행 (UTC 18:15 - 정각 혼잡 회피)
    - cron: '15 18 * * *'
  workflow_dispatch: # GitHub 웹페이지에서 [Run workflow] 버튼으로 즉시 수동 실행 가능

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 전국 유아동 관광지·휴양마을·키즈카페 공공데이터 자동 동기화
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: |
          if [ -n "$TOUR_API_KEY" ]; then
            python scripts/fetch_tourapi.py
          else
            echo "TOUR_API_KEY 시크릿이 설정되지 않아 기존 관광지 데이터(1,094곳)를 유지합니다."
          fi

      - name: 일일 안전 분할 맛집 크롤러 및 전국 행사·대회 데이터 수집기 실행
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY || 'G7N6elMlYOmqsOnctk%2B0X1Dpyz1ajBFF82gcH8Sl%2FgRDD5Jb4gangmAU2KZgmWSerzjtZqEQLlAxay4dFH3IPw%3D%3D' }}
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY || '6c424a69706b6a68323363476f4363' }}
          GG_API_KEY: ${{ secrets.GG_API_KEY || 'adb521523a0b4de0925726149359947a' }}
        run: |
          python scripts/build_events_data.py

      - name: 교육부(MOE) 공식 입시정보 및 교육정책 공시 자동 수집
        run: |
          python scripts/crawl_moe_admissions.py

      - name: 안심식당 공공데이터 수집 → 포털 실존 검증(일일 한도) → 데이터 빌드
        env:
          MAFRA_API_KEY: ${{ secrets.MAFRA_API_KEY }}
        run: |
          if [ ! -f scripts/data/mafra_raw.json ] && [ -n "$MAFRA_API_KEY" ]; then
            python scripts/pipeline_restaurants.py fetch
          fi
          python scripts/pipeline_restaurants.py verify --limit 4000 --workers 8
          python scripts/pipeline_restaurants.py heal --limit 150
          python scripts/pipeline_restaurants.py build

      - name: 변경 데이터 자동 커밋 및 배포
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f js/restaurants_data.js js/attractions_data.js js/events_data.js js/admissions_data.js data/seeds/admissions_official_seed.json scripts/data/mafra_raw.json scripts/data/verify_cache.json
          if git diff --staged --quiet; then
            echo "갱신할 변경사항이 없습니다."
          else
            git commit -m "chore(crawler): 일일 맛집, 관광지, 전국 행사·대회, 교육부 입시정보 자동 수집 및 갱신 [skip ci]"
            git push origin main
          fi
